name: Rebuild ask index
on:
  push:
    branches: [main]
    paths: ["content/ask/**", "scripts/build_ask_index.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_ask_index.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- content/ask/index.json; then echo "index unchanged"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add content/ask/index.json
          git commit -m "Rebuild ask index"
          git push
