<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kunxiang Shen · Digital Life</title>
  <meta name="description" content="Kunxiang Shen: MSc Data Science student at FU Berlin, software engineer building LLM agent systems. Explore an interactive text-adventure portfolio.">
  <!-- Link preview (edit after deploying) -->
  <meta property="og:title" content="Kunxiang Shen · Digital Life">
  <meta property="og:description" content="Kunxiang Shen: MSc Data Science @ FU Berlin, ex-SAP intern. An interactive text-adventure portfolio.">
  <meta property="og:type" content="website">
  <!-- <meta property="og:image" content="https://your-github-username.github.io/assets/og.png"> -->
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" type="image/png" href="assets/avatar.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Intro animation -->
  <div id="intro" hidden>
    <div id="intro-text" class="intro-text">
      <div class="intro-hello"><span id="intro-hello"></span> <b id="intro-name"></b></div>
      <div id="intro-status" class="intro-status"></div>
    </div>
    <button id="skip" class="skip" type="button">Skip</button>
  </div>

  <!-- Terminal -->
  <div class="app">
    <header class="bar">
      <div class="brand"><img class="avatar" src="assets/avatar.png" alt="" width="24" height="31"><b id="brand-name"></b></div>
      <div class="bar-actions">
        <button id="quick-btn" class="ghost" type="button">Quick view</button>
        <div id="langs" class="langs" role="group" aria-label="Language"></div>
      </div>
    </header>

    <main id="screen" class="screen" aria-live="polite">
      <div id="output"></div>
    </main>

    <footer class="console">
      <div id="chips" class="chips"></div>
      <form id="prompt" class="prompt-row" autocomplete="off">
        <span class="prompt" aria-hidden="true">&gt;</span>
        <input id="cmd" type="text" spellcheck="false" autocapitalize="off" autocorrect="off" enterkeyhint="send" aria-label="Command">
      </form>
    </footer>
  </div>

  <!-- Quick view overlay -->
  <div id="quick" class="quick" hidden>
    <article class="quick-card" role="dialog" aria-modal="true">
      <button id="quick-close" class="quick-close" type="button">×</button>
      <div id="quick-body"></div>
    </article>
  </div>

  <noscript><p style="color:#9fe;padding:2rem;font-family:monospace">This site is an interactive terminal and needs JavaScript.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
